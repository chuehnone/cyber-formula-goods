<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿斯拉歷代機體時間軸｜新世紀GPX閃電霹靂車 車型演進與周邊商品</title>
<meta name="description" content="《新世紀GPX閃電霹靂車》主角機阿斯拉的歷代車型時間軸：從 TV 版的阿斯拉 G.S.X、超級阿斯拉 01，到 11／ZERO 的超級阿斯拉 AKF-11，再到 SAGA／SIN 的 ν 阿斯拉 AKF-0 與 AKF-0/G。對照劇中年代、作品、規格，並列出本站收錄的對應周邊商品。">
<link rel="canonical" href="https://chuehnone.viovie.co/cyber-formula-goods/timeline.html">

<meta property="og:type" content="article">
<meta property="og:title" content="阿斯拉歷代機體時間軸">
<meta property="og:description" content="阿斯拉 G.S.X → 超級阿斯拉 01 → AKF-11 → ν 阿斯拉 AKF-0 → AKF-0/G，對照劇中年代、作品與周邊商品。">
<meta property="og:url" content="https://chuehnone.viovie.co/cyber-formula-goods/timeline.html">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #f6f8fa; --surface: #fff; --surface-2: #f0f3f6;
    --border: #d5dae0; --text: #1c2128; --text-dim: #5b6570;
    --accent: #1f6feb; --accent-soft: rgba(31,111,235,.1);
    --danger: #cf222e; --ok: #1a7f37; --warn: #9a6700;
    --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.05);
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --surface: #161b22; --surface-2: #1c232c;
    --border: #2d333b; --text: #e6edf3; --text-dim: #8b949e;
    --accent: #58a6ff; --accent-soft: rgba(88,166,255,.14);
    --danger: #f85149; --ok: #3fb950; --warn: #d29922;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Hiragino Sans", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  header {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: saturate(1.6) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .head-inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px;
                display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand h1 { font-size: 18px; margin: 0; }
  .brand .sub { font-size: 11.5px; color: var(--text-dim); }

  .icon-btn {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; white-space: nowrap;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px; }

  .lede { color: var(--text-dim); font-size: 14px; margin: 0 0 8px; }
  .srcnote {
    font-size: 12.5px; color: var(--text-dim); background: var(--surface);
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 14px; margin: 16px 0 28px;
  }

  /* 時間軸 */
  .tl { position: relative; padding-left: 34px; }
  .tl::before {
    content: ''; position: absolute; left: 11px; top: 6px; bottom: 6px;
    width: 2px; background: var(--border);
  }
  .node { position: relative; margin: 0 0 30px; }
  .node::before {
    content: ''; position: absolute; left: -28px; top: 20px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent);
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .card-head { padding: 16px 18px 14px; }
  .yearline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .year { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .year small { font-size: 12px; font-weight: 500; color: var(--text-dim); margin-left: 3px; }
  .works { display: flex; gap: 6px; flex-wrap: wrap; }
  .wtag {
    font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
    font-weight: 600;
  }
  .mname { font-size: 17px; font-weight: 650; margin: 2px 0 1px; }
  .mja { font-size: 12.5px; color: var(--text-dim); }
  .carno { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  .carno b { color: var(--text); font-weight: 600; }

  .summary { font-size: 13.5px; margin: 12px 0 0; }
  .detail { font-size: 13px; color: var(--text-dim); margin: 8px 0 0; }

  .forms { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .form {
    font-size: 11.5px; padding: 2px 9px; border-radius: 6px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  }

  .spec { border-top: 1px solid var(--border); background: var(--surface-2); }
  .spec-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px; background: var(--border);
  }
  .spec-cell { background: var(--surface-2); padding: 9px 14px; }
  .spec-cell dt { font-size: 11px; color: var(--text-dim); margin: 0 0 1px; }
  .spec-cell dd { font-size: 13px; margin: 0; font-variant-numeric: tabular-nums; }

  /* 商品 */
  .goods { border-top: 1px solid var(--border); padding: 14px 18px 16px; }
  .goods-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 11px;
  }
  .goods-head .lbl { font-size: 13px; font-weight: 600; }
  .goods-head .cnt {
    font-size: 11.5px; color: var(--text-dim); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px;
  }
  .goods-head .all { margin-left: auto; font-size: 12.5px; text-decoration: none; }
  .goods-head .all:hover { text-decoration: underline; }

  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .thumb { text-decoration: none; color: inherit; display: block; }
  .thumb .ph {
    aspect-ratio: 1/1; background: #fff; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb:hover .ph { border-color: var(--accent); }
  .thumb .cap {
    font-size: 11px; line-height: 1.4; margin-top: 5px; color: var(--text-dim);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .thumb:hover .cap { color: var(--accent); }
  .none { font-size: 12.5px; color: var(--text-dim); }

  footer {
    max-width: 1100px; margin: 0 auto; padding: 20px; border-top: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px; text-align: center; line-height: 1.9;
  }
  .err {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; text-align: center; color: var(--text-dim); font-size: 13.5px;
  }

  @media (max-width: 560px) {
    .tl { padding-left: 24px; }
    .tl::before { left: 6px; }
    .node::before { left: -23px; }
    .year { font-size: 19px; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <h1>阿斯拉歷代機體時間軸</h1>
      <span class="sub">ASURADA / アスラーダ</span>
    </div>
    <a class="back-link" href="index.html">← 回商品一覽</a>
    <button class="icon-btn" id="themeBtn" aria-label="切換深淺色">◐</button>
  </div>
</header>

<div class="wrap">
  <p class="lede">
    主角機「阿斯拉」在動畫劇中年代裡的車型演進。每個時間點列出當時的機體、所屬作品，
    以及本站收錄的對應周邊商品。
  </p>

  <div class="srcnote" id="srcnote"></div>

  <div class="tl" id="tl"></div>
</div>

<footer id="footer"></footer>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // 與 index.html 相同：去掉分隔符後比對，AKF11 ↔ AKF-11
  const compact = s => String(s).toLowerCase().replace(/[.\s\-_/·・‧]/g, '');

  // 外部商品連結加上來源標記，與 index.html 的 withUtm() 同一套參數
  const UTM = { utm_source: 'cyber-formula-goods',
                utm_medium: 'referral',
                utm_campaign: 'product-link' };
  const withUtm = url => {
    try {
      const u = new URL(url);
      for (const [k, v] of Object.entries(UTM)) {
        if (!u.searchParams.has(k)) u.searchParams.set(k, v);
      }
      return u.toString();
    } catch (e) {
      return url;
    }
  };

  /* 主題：與 index.html 共用 localStorage 的 cf-theme */
  const applyTheme = t => {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('cf-theme', t); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('cf-theme'); } catch (e) {}
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('themeBtn').onclick = () =>
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  /* 機體 → 商品比對
     兩種依據，都不是「從機體名反推作品」：
       1. machineNames：對上 products.json 既有的 machine.ja 標記
       2. modelKeys：商品名裡明寫的型號（AKF-11、AKF-0/G⋯）
     _exclude 擋掉玩具線專有名稱（テクニ四駆 的 AKF-1、スーパーアスラーダ02）
     與遊戲限定機體，那些在動畫時間軸上不存在。 */
  const assign = (products, machines, exclude) => {
    const byId = Object.create(null);
    machines.forEach(m => { byId[m.id] = []; });

    // 型號長者優先：AKF-0/G 必須贏過 AKF-0，否則會被前者吃掉
    const order = machines.slice().sort((a, b) => {
      const la = Math.max(0, ...(a.modelKeys || []).map(k => k.length));
      const lb = Math.max(0, ...(b.modelKeys || []).map(k => k.length));
      return lb - la;
    });

    for (const p of products) {
      const ja = p.nameJa || '';
      if (exclude.some(x => ja.includes(x))) continue;

      const mja = (p.machine || {}).ja || '';
      const cn = compact(ja);
      for (const m of order) {
        const hit = (mja && (m.machineNames || []).includes(mja))
                 || (m.modelKeys || []).some(k => compact(k) && cn.includes(compact(k)));
        if (hit) { byId[m.id].push(p); break; }
      }
    }
    return byId;
  };

  const thumbHtml = p => {
    const name = p.nameZh || p.nameJa;
    const src = (p.sources && p.sources[0]) || null;
    const href = src ? withUtm(src.url) : '#';
    const img = p.image
      ? `<img src="${esc(p.image)}" alt="${esc(name)}" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">`
      : '<span style="font-size:22px">🏎️</span>';
    return `<a class="thumb" href="${esc(href)}" target="_blank" rel="noopener"
               referrerpolicy="strict-origin-when-cross-origin" title="${esc(name)}">
      <span class="ph">${img}</span>
      <span class="cap">${esc(name)}</span>
    </a>`;
  };

  const SPEC_LABEL = { length: '全長', weight: '車重', power: '最高出力',
                       topSpeed: '最高速度', engine: '引擎' };

  const nodeHtml = (m, works, goods) => {
    const yr = m.storyYearTo ? `${m.storyYear}–${m.storyYearTo}` : `${m.storyYear}`;
    const wtags = (m.workIds || []).map(id => {
      const w = works.find(x => x.id === id);
      return w ? `<span class="wtag">${esc(w.name)}</span>` : '';
    }).join('');

    const specKeys = Object.keys(m.spec || {}).filter(k => m.spec[k]);
    const specHtml = specKeys.length ? `
      <div class="spec"><dl class="spec-grid">${specKeys.map(k => `
        <div class="spec-cell">
          <dt>${esc(SPEC_LABEL[k] || k)}</dt><dd>${esc(m.spec[k])}</dd>
        </div>`).join('')}</dl></div>` : '';

    // 商品連回 index.html 的機體篩選。用 filterName 而非 name：
    // 時間軸用精確型號（ν 阿斯拉 AKF-0/G），products.json 的桶名較粗（ν 阿斯拉），
    // 兩者不一致時 index.html 會忽略參數，等於連結失效。
    const allHref = `index.html?machine=${encodeURIComponent(m.filterName || m.name)}`;
    const SHOW = 6;
    const goodsHtml = goods.length ? `
      <div class="goods-head">
        <span class="lbl">本站收錄的周邊</span>
        <span class="cnt">${goods.length} 件</span>
        <a class="all" href="${esc(allHref)}">在商品頁看全部 →</a>
      </div>
      <div class="thumbs">${goods.slice(0, SHOW).map(thumbHtml).join('')}</div>`
      : `<div class="goods-head"><span class="lbl">本站收錄的周邊</span></div>
         <div class="none">目前沒有收錄此機體的商品。</div>`;

    return `<div class="node"><div class="card">
      <div class="card-head">
        <div class="yearline">
          <span class="year">${esc(yr)}<small>年（劇中）</small></span>
          <span class="works">${wtags}</span>
        </div>
        <div class="mname">${esc(m.name)}</div>
        <div class="mja">${esc(m.nameJa)}　${esc(m.model || '')}</div>
        ${m.carNo ? `<div class="carno">車號 <b>${esc(m.carNo)}</b></div>` : ''}
        <p class="summary">${esc(m.summary)}</p>
        ${m.detail ? `<p class="detail">${esc(m.detail)}</p>` : ''}
        ${(m.forms || []).length
          ? `<div class="forms">${m.forms.map(f => `<span class="form">${esc(f)}</span>`).join('')}</div>`
          : ''}
      </div>
      ${specHtml}
      <div class="goods">${goodsHtml}</div>
    </div></div>`;
  };

  Promise.all([
    fetch('scripts/timeline.json').then(r => {
      if (!r.ok) throw new Error('timeline.json HTTP ' + r.status); return r.json();
    }),
    fetch('products.json').then(r => {
      if (!r.ok) throw new Error('products.json HTTP ' + r.status); return r.json();
    })
  ]).then(([tl, data]) => {
    const machines = tl.machines.slice().sort((a, b) => a.storyYear - b.storyYear);
    const goodsBy = assign(data.products, tl.machines, tl._exclude || []);

    $('tl').innerHTML = machines.map(m => nodeHtml(m, tl.works, goodsBy[m.id] || [])).join('');

    const s = tl._source || {};
    $('srcnote').innerHTML =
      `機體設定、劇中年代與規格取自${s.url
        ? `<a href="${esc(s.url)}" target="_blank" rel="noopener"
              referrerpolicy="strict-origin-when-cross-origin">${esc(s.site)}</a>`
        : esc(s.site || '外部資料')}（查閱於 ${esc(s.fetchedAt || '—')}）。` +
      `此頁的設定資料為人工整理，與商品資料分開維護；商品資訊則與商品頁同樣取自青島官方與 hobbysearch。`;

    const total = Object.values(goodsBy).reduce((n, a) => n + a.length, 0);
    $('footer').innerHTML =
      `阿斯拉歷代機體時間軸 · 對應本站 ${total} 件周邊商品 · 商品資料更新於 ${esc(data.meta.updatedAt)}<br>` +
      `<a href="index.html">← 回商品一覽</a><br>` +
      '商品圖片與資料版權屬各來源網站及 ©サンライズ 所有';
  }).catch(err => {
    $('tl').innerHTML = `<div class="err"><b>無法載入資料</b><br>${esc(err.message)}<br>
      用 file:// 開啟會被 CORS 擋下。請執行 <code>./serve.sh</code> 後開 localhost。</div>`;
  });
})();
</script>
</body>
</html>
