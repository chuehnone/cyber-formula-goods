<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 商品一覽頁的 OG 圖。
       車體照為 scripts/assets/car.jpg——阿斯拉 G.S.X 主視覺裁出的車體部分，
       已切掉作品 logo、標題美術與賽道看板字樣。原始未裁的圖不留在 repo。
       文字與背景為本站自繪，配色取自 index.html 的深色主題 token。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131a24"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <!-- 左側遮罩：讓文字在車體照上仍有足夠對比 -->
    <linearGradient id="scrim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="820" y2="0">
      <stop offset="0%"   stop-color="#0b1119" stop-opacity=".99"/>
      <stop offset="50%"  stop-color="#0b1119" stop-opacity=".94"/>
      <stop offset="76%"  stop-color="#0b1119" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0b1119" stop-opacity="0"/>
    </linearGradient>
    <!-- 上下邊緣壓暗，讓格紋帶與網址壓得住 -->
    <linearGradient id="vig" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="630">
      <stop offset="0%"   stop-color="#0b1119" stop-opacity=".78"/>
      <stop offset="24%"  stop-color="#0b1119" stop-opacity="0"/>
      <stop offset="74%"  stop-color="#0b1119" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b1119" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 車體照：靠右 -->
  <image href="assets/car.jpg" x="180" y="0" width="1020" height="630"
         preserveAspectRatio="xMidYMid slice"/>

  <rect width="1200" height="630" fill="url(#vig)"/>
  <rect width="830" height="630" fill="url(#scrim)"/>

  <!-- 賽道格紋帶（上緣） -->
  <g opacity=".55">
    <rect x="0" y="0" width="1200" height="10" fill="#161b22"/>
    <g fill="#58a6ff" opacity=".9">
      <rect x="0"   y="0" width="20" height="5"/><rect x="40"  y="0" width="20" height="5"/>
      <rect x="80"  y="0" width="20" height="5"/><rect x="120" y="0" width="20" height="5"/>
      <rect x="20"  y="5" width="20" height="5"/><rect x="60"  y="5" width="20" height="5"/>
      <rect x="100" y="5" width="20" height="5"/><rect x="140" y="5" width="20" height="5"/>
    </g>
  </g>

  <!-- 左側文字 -->
  <g transform="translate(84, 150)">
    <g>
      <rect x="0" y="0" width="182" height="34" rx="17" fill="#58a6ff" fill-opacity=".18"/>
      <text x="91" y="23" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="15" font-weight="600" fill="#7cc0ff" text-anchor="middle"
            letter-spacing="1.5">CYBER FORMULA</text>
    </g>

    <text x="0" y="112" font-family="'PingFang TC','Hiragino Sans','Heiti TC',sans-serif"
          font-size="76" font-weight="700" fill="#ffffff" letter-spacing="1">閃電霹靂車</text>
    <text x="0" y="196" font-family="'PingFang TC','Hiragino Sans','Heiti TC',sans-serif"
          font-size="60" font-weight="600" fill="url(#accent)" letter-spacing="4">周邊商品一覽</text>

    <rect x="2" y="228" width="72" height="4" rx="2" fill="#58a6ff"/>

    <text x="0" y="280" font-family="'PingFang TC','Hiragino Sans','Heiti TC',sans-serif"
          font-size="25" fill="#c2ccd8" letter-spacing=".5">組裝模型 · 完成品 · Figure · 周邊</text>
    <text x="0" y="322" font-family="'PingFang TC','Hiragino Sans','Heiti TC',sans-serif"
          font-size="22" fill="#93a1b1" letter-spacing=".3">中日文對照，可依分類與機體篩選</text>
  </g>

  <text x="84" y="566" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" fill="#7cc0ff"
        letter-spacing=".4">chuehnone.viovie.co/cyber-formula-goods</text>

  <!-- 底部格紋帶 -->
  <g opacity=".55">
    <rect x="0" y="620" width="1200" height="10" fill="#161b22"/>
    <g fill="#58a6ff" opacity=".9">
      <rect x="1040" y="620" width="20" height="5"/><rect x="1080" y="620" width="20" height="5"/>
      <rect x="1120" y="620" width="20" height="5"/><rect x="1160" y="620" width="20" height="5"/>
      <rect x="1060" y="625" width="20" height="5"/><rect x="1100" y="625" width="20" height="5"/>
      <rect x="1140" y="625" width="20" height="5"/><rect x="1180" y="625" width="20" height="5"/>
    </g>
  </g>
</svg>
